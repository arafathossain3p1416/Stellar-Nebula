<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>অধ্যায় ৪: পর্যায় সারণি</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<aside>
  <h1><a href="chemistry.html">রসায়ন ল্যাব</a></h1>
  <nav id="nav"></nav>
</aside>

<main>
  <h1 class="pg">অধ্যায় ৪: পর্যায় সারণি</h1>
  <div id="sims"></div>
</main>

<script src="common.js"></script>
<script>
  const CHEM_CHS = [
    "রসায়নের ধারণা","পদার্থের অবস্থা","পদার্থের গঠন","পর্যায় সারণি","রাসায়নিক বন্ধন",
    "মোলের ধারণা ও রাসায়নিক গণনা","রাসায়নিক বিক্রিয়া","রসায়ন ও শক্তি","এসিড-ক্ষারক ও pH",
    "খনিজ সম্পদ—ধাতু ও অধাতু","খনিজ সম্পদ—জীবাশ্ম","আমাদের জীবনে রসায়ন"
  ];
  const CHEM_DONE = [1,2,3,4];

  function chemNavHTML(active) {
    let html = '';
    CHEM_CHS.forEach((name, i) => {
      const num = i + 1;
      const pad = String(num).padStart(2, '0');
      if (CHEM_DONE.includes(num)) {
        html += `<a href="chem${pad}.html" class="${active === num ? 'active' : ''}">${num}. ${name}</a>`;
      } else {
        html += `<span class="disabled">${num}. ${name}</span>`;
      }
    });
    return html;
  }
  $('#nav').innerHTML = chemNavHTML(4);

  // ===== 1. পর্যায় সারণিতে মৌলের অবস্থান =====
  sim({
    t: 'পর্যায় সারণিতে মৌলের অবস্থান',
    c: [['el', 'মৌল নির্বাচন (১=H … ২০=Ca)', 1, 20, 11, 1]],
    f: (p, t) => {
      const elements = [
        {z:1,s:'H',g:1,p:1},{z:2,s:'He',g:18,p:1},
        {z:3,s:'Li',g:1,p:2},{z:4,s:'Be',g:2,p:2},{z:5,s:'B',g:13,p:2},{z:6,s:'C',g:14,p:2},{z:7,s:'N',g:15,p:2},{z:8,s:'O',g:16,p:2},{z:9,s:'F',g:17,p:2},{z:10,s:'Ne',g:18,p:2},
        {z:11,s:'Na',g:1,p:3},{z:12,s:'Mg',g:2,p:3},{z:13,s:'Al',g:13,p:3},{z:14,s:'Si',g:14,p:3},{z:15,s:'P',g:15,p:3},{z:16,s:'S',g:16,p:3},{z:17,s:'Cl',g:17,p:3},{z:18,s:'Ar',g:18,p:3},
        {z:19,s:'K',g:1,p:4},{z:20,s:'Ca',g:2,p:4}
      ];
      const el = elements[Math.round(p.el)-1];

      rc(40, 40, 560, 260, col.ln);
      tx(el.s + ' (Z = ' + el.z + ')', 320, 40, col.ac, 'center');

      // Simple grid representation
      for (let g = 1; g <= 18; g++) {
        for (let per = 1; per <= 4; per++) {
          const x = 50 + g * 28;
          const y = 70 + per * 40;
          rc(x, y, 24, 30, '#1a1a2e');
        }
      }
      // Highlight selected
      const hx = 50 + el.g * 28;
      const hy = 70 + el.p * 40;
      rc(hx, hy, 24, 30, col.am);
      tx(el.s, hx + 12, hy + 20, col.ink, 'center');

      tx('গ্রুপ: ' + el.g + '    পর্যায়: ' + el.p, 40, 340, col.ac);
      tx('পারমাণবিক সংখ্যা: ' + el.z, 40, 370, col.ink);
    }
  });

  // ===== 2. পারমাণবিক ব্যাসার্ধের পর্যায়ভিত্তিক পরিবর্তন =====
  sim({
    t: 'পারমাণবিক ব্যাসার্ধের পর্যায়ভিত্তিক পরিবর্তন',
    c: [['z', 'পারমাণবিক সংখ্যা', 3, 18, 11, 1]],
    f: (p, t) => {
      const z = Math.round(p.z);
      // Approximate radius (decreases across period)
      const period = z <= 10 ? 2 : 3;
      const radius = 80 - (z % 8) * 6;

      rc(40, 40, 560, 260, col.ln);
      tx('পারমাণবিক ব্যাসার্ধ (আনুমানিক)', 320, 40, col.ac, 'center');

      ci(320, 160, radius, col.am);
      ci(320, 160, 12, '#f72585');

      tx('Z = ' + z, 40, 330, col.ink);
      tx('বাম থেকে ডানে গেলে ব্যাসার্ধ কমে', 40, 360, col.ac);
      tx('উপর থেকে নিচে গেলে ব্যাসার্ধ বাড়ে', 40, 390, col.ink);
    }
  });

  // ===== 3. যোজ্যতা ইলেকট্রনের পরিবর্তন =====
  sim({
    t: 'যোজ্যতা ইলেকট্রনের পরিবর্তন',
    c: [['z', 'পারমাণবিক সংখ্যা', 1, 18, 11, 1]],
    f: (p, t) => {
      const z = Math.round(p.z);
      let valence = z;
      if (z > 2) valence = z - 2;
      if (z > 10) valence = z - 10;
      if (valence > 8) valence = valence - 8;

      rc(40, 40, 560, 260, col.ln);
      tx('যোজ্যতা ইলেকট্রন', 320, 40, col.ac, 'center');

      // Nucleus
      ci(320, 150, 25, '#f72585');
      // Valence electrons
      for (let i = 0; i < valence; i++) {
        const angle = t * 1.2 + i * (Math.PI * 2 / valence);
        ci(320 + Math.cos(angle) * 90, 150 + Math.sin(angle) * 90, 9, col.am);
      }

      tx('পারমাণবিক সংখ্যা: ' + z, 40, 330, col.ink);
      tx('যোজ্যতা ইলেকট্রন: ' + valence, 40, 360, col.ac);
      tx('গ্রুপ নম্বর ≈ যোজ্যতা ইলেকট্রন (মূল গ্রুপ)', 40, 390, col.ink);
    }
  });

  // ===== 4. ধাতু, অধাতু ও উপধাতু =====
  sim({
    t: 'ধাতু, অধাতু ও উপধাতুর বৈশিষ্ট্য',
    c: [['type', 'প্রকার (০=ধাতু, ১=উপধাতু, ২=অধাতু)', 0, 2, 0, 1]],
    f: (p, t) => {
      const types = ['ধাতু', 'উপধাতু', 'অধাতু'];
      const props = [
        'চকচকে, পরিবাহী, নমনীয়, ধনাত্মক আয়ন তৈরি করে',
        'ধাতু ও অধাতুর মাঝামাঝি বৈশিষ্ট্য',
        'অপরিবাহী, ভঙ্গুর, ঋণাত্মক আয়ন তৈরি করে'
      ];
      const examples = ['Na, Mg, Al, Fe, Cu', 'B, Si, Ge, As', 'C, N, O, F, Cl, S'];
      const idx = Math.round(p.type);

      rc(40, 50, 560, 240, col.ln);
      tx(types[idx], 320, 40, col.ac, 'center');

      // Color block
      const colors = ['#f4a261', '#e9c46a', '#2a9d8f'];
      rc(200, 100, 240, 120, colors[idx]);

      tx(props[idx], 40, 320, col.ink);
      tx('উদাহরণ: ' + examples[idx], 40, 360, col.ac);
    }
  });

  // ===== 5. ইলেকট্রন বিন্যাস থেকে গ্রুপ নির্ণয় =====
  sim({
    t: 'ইলেকট্রন বিন্যাস থেকে মৌলের গ্রুপ নির্ণয়',
    c: [['z', 'পারমাণবিক সংখ্যা', 1, 18, 11, 1]],
    f: (p, t) => {
      const z = Math.round(p.z);
      let shells = [0,0,0];
      let rem = z;
      const maxs = [2,8,8];
      for (let i=0;i<3;i++){ shells[i]=Math.min(rem,maxs[i]); rem-=shells[i]; }
      const valence = shells[shells.length-1] || shells[0];
      let group = valence;
      if (z === 2 || z === 10 || z === 18) group = 18;

      rc(40, 40, 560, 260, col.ln);
      tx('ইলেকট্রন বিন্যাস → গ্রুপ', 320, 40, col.ac, 'center');

      tx('বিন্যাস: ' + shells.filter(x=>x>0).join(', '), 40, 100, col.ink);
      tx('যোজ্যতা ইলেকট্রন: ' + valence, 40, 140, col.am);
      tx('গ্রুপ নম্বর: ' + group, 40, 180, col.ac);

      tx('নিয়ম: যোজ্যতা ইলেকট্রন = গ্রুপ নম্বর (মূল গ্রুপ মৌল)', 40, 340, col.ink);
      tx('নিষ্ক্রিয় গ্যাস → গ্রুপ ১৮', 40, 370, col.ink);
    }
  });
</script>
</body>
</html>
