<!DOCTYPE html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>অধ্যায় ৪: কাজ, ক্ষমতা ও শক্তি</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"></head><body>
<aside><h1><a href="index.html">পদার্থবিজ্ঞান ল্যাব</a></h1><nav id="nav"></nav></aside>
<main><h1 class="pg">অধ্যায় ৪: কাজ, ক্ষমতা ও শক্তি</h1><div id="sims"></div></main>
<script src="common.js"></script>
<script src="info.js"></script>
<script>
$('#nav').innerHTML=navHTML(4);

sim({t:'বল প্রয়োগে কাজ',c:[['F','বল (N)',0,100,40,1],['a','বলের কোণ (°)',0,90,30,1],['d','সরণ (মি)',1,10,6,1]],
 f:(p,t)=>{const T=t%5,s=p.d*Math.min(T/3,1),th=p.a*PI/180,x=40+s*50,L=Math.max(10,Math.min(p.F*2.2,200)),cx=x+30,cy=280;rc(0,300,640,80,col.ln);rc(x,260,60,40,col.ac);
 if(p.F>0){ar(cx,cy,cx+L*Math.cos(th),cy-L*Math.sin(th),col.am);ln(cx,cy,cx+L*Math.cos(th),cy,col.ink,1,1)}ar(40,330,40+p.d*50,330,col.ink);tx('সরণ d = '+p.d+' মি',40,356);
 tx('কাজ W = F · d · cosθ = '+(p.F*p.d*Math.cos(th)).toFixed(1)+' জুল',16,26,col.ac);tx('এ পর্যন্ত কাজ = '+(p.F*s*Math.cos(th)).toFixed(1)+' জুল',16,52);tx(p.a==90?'বল সরণের সাথে লম্ব, তাই কাজ = ০':'সরণের দিকের উপাংশ F cosθ = '+(p.F*Math.cos(th)).toFixed(1)+' N',16,78)}});

sim({t:'গতিশক্তি ও বিভবশক্তির রূপান্তর',c:[['v','উপরে ছোঁড়ার বেগ (মি/সে)',5,25,15,1],['m','ভর (কেজি)',1,10,2,1]],
 f:(p,t)=>{const G=9.8,T=2*p.v/G,s=Math.min(t%(T+1),T),h=p.v*s-.5*G*s*s,vv=p.v-G*s,H=p.v*p.v/(2*G),sc=260/H,E=.5*p.m*p.v**2,pe=p.m*G*h,ke=.5*p.m*vv*vv;
 rc(0,330,640,50,col.ln);ln(260,330,260,330-H*sc,col.ln,1,1);ci(200,330-h*sc,14,col.am);tx('সর্বোচ্চ উচ্চতা '+H.toFixed(1)+' মি',270,330-H*sc+5);
 rc(420,330-240*Math.max(0,pe)/E,50,240*Math.max(0,pe)/E,col.am);rc(500,330-240*ke/E,50,240*ke/E,col.ac);ln(410,90,570,90,col.ink,1,1);tx('বিভব',445,352,col.ink,'center');tx('গতি',525,352,col.ink,'center');
 tx('মোট শক্তি = '+E.toFixed(0)+' জুল (স্থির)',360,26,col.ac);tx('h = '+h.toFixed(1)+' মি, v = '+Math.abs(vv).toFixed(1)+' মি/সে',360,52)}});

sim({t:'শক্তির নিত্যতা (স্প্রিং ও বস্তু)',c:[['A','বিস্তার (মি)',.5,2,1.5,.1],['k','স্প্রিং ধ্রুবক k (N/মি)',10,100,40,5],['m','ভর (কেজি)',.5,5,2,.5]],
 f:(p,t)=>{const w=Math.sqrt(p.k/p.m),x=p.A*Math.cos(w*t),v=-p.A*w*Math.sin(w*t),E=.5*p.k*p.A**2,pe=.5*p.k*x*x,ke=.5*p.m*v*v,cx=320+80*x;
 rc(30,120,10,100,col.ink);ln(0,200,640,200,col.ln,2);ln(320,120,320,215,col.ink,1,1);g.beginPath();g.strokeStyle=col.ink;g.lineWidth=2;for(let i=0;i<=14;i++)g[i?'lineTo':'moveTo'](40+(cx-70)*i/14,170+(i==0||i==14?0:i%2?-12:12));g.stroke();rc(cx-30,140,60,60,col.ac);
 tx('স্প্রিংয়ের বিভব শক্তি',60,262);rc(60,270,400*pe/E,20,col.am);tx('গতিশক্তি',60,322);rc(60,330,400*ke/E,20,col.ac);tx('মোট শক্তি = '+E.toFixed(1)+' জুল (স্থির)',16,26,col.ac);tx('বিভব + গতি = '+(pe+ke).toFixed(1)+' জুল',16,52)}});

sim({t:'ক্ষমতা ও কর্মদক্ষতা',c:[['m','ভার (কেজি)',1,50,10,1],['h','উচ্চতা (মি)',1,20,5,1],['t','সময় (সে)',1,10,4,1],['e','কর্মদক্ষতা (%)',10,100,60,5]],
 f:(p,t)=>{const G=9.8,W=p.m*G*p.h,eta=p.e/100,Ein=W/eta,T=Math.min(t%(p.t+1.5),p.t),y=330-12*p.h*T/p.t;rc(0,330,640,50,col.ln);ci(100,40,12,col.ink);ln(100,40,100,y-30,col.ink,2);rc(80,y-30,40,30,col.ac);
 tx('প্রদত্ত শক্তি',250,64);rc(250,70,330,26,col.am);tx('কাজে লাগা শক্তি',250,126);rc(250,132,330*eta,26,col.ac);rc(250+330*eta,132,330*(1-eta),26,col.ln);
 tx('কাজ W = mgh = '+W.toFixed(0)+' জুল',250,200);tx('ক্ষমতা P = W/t = '+(W/p.t).toFixed(1)+' ওয়াট',250,226,col.ac);tx('প্রদত্ত শক্তি = '+Ein.toFixed(0)+' জুল',250,252);tx('অপচয় শক্তি = '+(Ein-W).toFixed(0)+' জুল',250,278);tx('কর্মদক্ষতা = কাজে লাগা ÷ প্রদত্ত = '+p.e+'%',250,304)}});
</script></body></html>
